name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs never need write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt (no unformatted files)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test (race detector)
        run: go test -race -count=1 -cover ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build reptile
        run: |
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -ldflags="-s -w \
            -X github.com/0xinterface/reptile/internal/app.version=${GITHUB_REF_NAME} \
            -X github.com/0xinterface/reptile/internal/app.commit=${GITHUB_SHA} \
            -X github.com/0xinterface/reptile/internal/app.buildDate=${build_date}" \
            -o dist/reptile-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/reptile
      - name: version output smoke
        if: matrix.goarch == 'amd64'
        run: ./dist/reptile-${{ matrix.goos }}-${{ matrix.goarch }} version
      - name: verify binary
        run: |
          test -x dist/reptile-${{ matrix.goos }}-${{ matrix.goarch }}

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs never need write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt (no unformatted files)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test (race detector)
        run: go test -race -count=1 -cover ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install network integration tools
        run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - name: privileged Linux integration tests
        run: |
          sudo env "PATH=/usr/sbin:$PATH" REPTILE_REQUIRE_INTEGRATION=1 \
            go test -tags=integration -count=1 \
            -run 'Test(FirewallNamespace|InstalledSystemdSandbox)$' ./internal/app

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            file_arch: x86-64
          - goos: linux
            goarch: arm64
            file_arch: ARM aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build reptile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath -ldflags="-s -w \
            -X github.com/0xinterface/reptile/internal/app.version=${GITHUB_REF_NAME} \
            -X github.com/0xinterface/reptile/internal/app.commit=${GITHUB_SHA} \
            -X github.com/0xinterface/reptile/internal/app.buildDate=${build_date}" \
            -o dist/reptile-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/reptile
      - name: version output smoke
        if: matrix.goarch == 'amd64'
        run: ./dist/reptile-${{ matrix.goos }}-${{ matrix.goarch }} version
      - name: verify binary architecture
        run: |
          test -x dist/reptile-${{ matrix.goos }}-${{ matrix.goarch }}
          description="$(file dist/reptile-${{ matrix.goos }}-${{ matrix.goarch }})"
          case "$description" in
            *"${{ matrix.file_arch }}"*) ;;
            *) echo "wrong architecture: $description" >&2; exit 1 ;;
          esac
  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: check

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
